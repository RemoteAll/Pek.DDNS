[package]
name = "Rust_DDNS"
version = "0.1.4"
edition = "2021"
description = "高性能、可扩展 DDNS（动态域名解析）工具 - Rust 重写版"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["gzip"] }
chrono = { version = "0.4", features = ["clock"] }
# DH 基础库（DH.RustBase）：通用日志（控制台着色 + 按天滚动文件 Log/，对齐 DH.NCore NewLife.Log）
dhrust = { path = "../../../Code/Rust/DH.RustBase" }
